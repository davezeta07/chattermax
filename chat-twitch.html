<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat de Twitch</title>
<style>
:root{--bg:#14161c;--panel:#1b1e27;--line:#2a2e3a;--tx:#e7e9ef;--mut:#8b91a3;--ac:#a98bff}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
input,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:.45rem .7rem}
button{cursor:pointer;background:var(--ac);color:#15121f;border-color:transparent;font-weight:600}
button.sec{background:var(--bg);color:var(--tx);border-color:var(--line);font-weight:400}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.hide{display:none!important}
#setup{max-width:560px;margin:3rem auto;padding:0 1.2rem}
#setup h1{font-size:1.5rem;margin:0 0 .6rem}
#setup ol{padding-left:1.2rem;color:var(--mut)}#setup li{margin:.4rem 0}
#setup code{background:var(--panel);padding:.15rem .4rem;border-radius:4px;color:var(--tx);word-break:break-all}
#setup input{width:100%;margin:.8rem 0}
#err{color:#ff8a8a;min-height:1.3em}
#app{flex:1;display:flex;flex-direction:column;min-height:0}
header{display:flex;gap:.5rem;align-items:center;padding:.6rem .8rem;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header input{width:min(220px,50vw)}
#st{color:var(--mut);font-size:13px;margin-left:auto}
#tabs{display:flex;gap:.3rem;padding:.4rem .8rem 0;overflow-x:auto;border-bottom:1px solid var(--line)}
.tab{display:flex;flex:none;border:1px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;overflow:hidden}
.tab button{border:0;border-radius:0;padding:.3rem .6rem}
.tab .x{padding:.3rem .45rem;color:var(--mut)}
.tab.on{background:var(--panel)}.tab.on button.sec{background:var(--panel)}
.tab.new>button:first-child::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ac);margin-left:.4rem}
#panes{flex:1;position:relative;min-height:0}
.pane{position:absolute;inset:0;overflow-y:auto;padding:.6rem .9rem}
.pane:not(.on){display:none}
.m{padding:.12rem 0;overflow-wrap:anywhere}
.m time{color:var(--mut);font-size:12px;margin-right:.45rem}
.bd{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 .3rem;margin-right:.3rem;color:var(--mut)}
.u{font-weight:700}.em{height:1.5em;vertical-align:middle;margin:0 1px}
.act .t{font-style:italic}.del .t{text-decoration:line-through;opacity:.5}
.sys{color:var(--mut);font-size:13px;padding:.2rem 0}
footer{display:flex;gap:.5rem;padding:.6rem .8rem;background:var(--panel);border-top:1px solid var(--line)}
footer input{flex:1;min-width:0}
#main{flex:1;display:flex;min-height:0}
#video{display:none;flex:2;min-width:0;background:#000}
#main.vid #video{display:block}
#video iframe{width:100%;height:100%;border:0}
#main.vid #panes{flex:1;min-width:320px;border-left:1px solid var(--line)}
@media(max-width:800px){#main{flex-direction:column}#main.vid #video{flex:none;aspect-ratio:16/9}#main.vid #panes{border-left:0;border-top:1px solid var(--line)}}
</style></head><body>

<section id="setup" class="hide">
  <h1>Entra con tu cuenta de Twitch</h1>
  <ol>
    <li>Registra una aplicación en <code>dev.twitch.tv/console</code>.</li>
    <li>En "URL de redireccionamiento OAuth" pega exactamente esta dirección: <code id="redir"></code></li>
    <li>Elige el tipo de cliente "Público" y copia aquí su Client ID.</li>
  </ol>
  <input id="cid" placeholder="Client ID" autocomplete="off">
  <button id="login">Iniciar sesión con Twitch</button>
  <p id="err"></p>
</section>

<div id="app" class="hide">
  <header>
    <input id="chan" placeholder="Añadir canal (ej. feeden_)" autocomplete="off">
    <button id="go">Añadir canal</button>
    <button id="tv" class="sec">Ver stream</button>
    <button id="out" class="sec">Cerrar sesión</button>
    <span id="st"></span>
  </header>
  <nav id="tabs" aria-label="Canales abiertos"></nav>
  <div id="main"><div id="video"></div><main id="panes" aria-live="polite"></main></div>
  <footer>
    <input id="msg" placeholder="Escribe un mensaje" maxlength="500" autocomplete="off">
    <button id="send">Enviar</button>
  </footer>
</div>

<script>
const $=s=>document.querySelector(s);
const ls={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}},del:k=>{try{localStorage.removeItem(k)}catch{}}};
const BADGE={broadcaster:'Streamer',moderator:'Mod',lead_moderator:'Mod principal',vip:'VIP',subscriber:'Sub',founder:'Fundador',staff:'Staff'};
// Client ID público de la app (no es secreto). Así los demás solo pulsan "Iniciar sesión".
const CLIENT_ID='wtuifpaixy5m6dcepceoi0hoey7adz';
const fixed=!CLIENT_ID.startsWith('PEGA');
const redirect=location.origin+location.pathname;
let vid=ls.get('vid')==='1';
let token=ls.get('tok'),me=null,ws=null,chans=[],active=null,panes={},tabs={},ustate={};

$('#redir').textContent=redirect;
$('#cid').value=ls.get('cid')||'';
if(fixed){$('#setup ol').classList.add('hide');$('#cid').classList.add('hide')}

$('#login').onclick=()=>{
  const cid=fixed?CLIENT_ID:$('#cid').value.trim();
  if(!cid){$('#err').textContent='Escribe tu Client ID.';return}
  ls.set('cid',cid);
  const st=crypto.randomUUID();sessionStorage.setItem('st',st);
  location.href='https://id.twitch.tv/oauth2/authorize?'+new URLSearchParams({client_id:cid,redirect_uri:redirect,response_type:'token',scope:'chat:read chat:edit',state:st});
};
$('#out').onclick=()=>logout();
$('#go').onclick=()=>{open($('#chan').value);$('#chan').value=''};
$('#chan').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
$('#send').onclick=()=>send();
$('#msg').onkeydown=e=>{if(e.key==='Enter')send()};

function show(w,msg){
  $('#setup').classList.toggle('hide',w!=='setup');
  $('#app').classList.toggle('hide',w!=='app');
  if(msg)$('#err').textContent=msg;
}
function status(t){$('#st').textContent=t}
function logout(msg){ls.del('tok');token=null;if(ws){ws.onclose=null;ws.close()}ws=null;show('setup',msg)}

async function init(){
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get('access_token')){
    if(h.get('state')===sessionStorage.getItem('st')){token=h.get('access_token');ls.set('tok',token)}
    history.replaceState(null,'',location.pathname);
  }
  if(!token)return show('setup');
  try{
    const r=await fetch('https://id.twitch.tv/oauth2/validate',{headers:{Authorization:'OAuth '+token}});
    if(!r.ok)throw 0;
    me=await r.json();
  }catch{return logout('Tu sesión expiró. Inicia sesión otra vez.')}
  if(!(me.scopes||[]).includes('chat:edit'))return logout('Ahora la app también escribe en el chat. Inicia sesión otra vez para aceptar el permiso.');
  show('app');
  let saved=[];try{saved=JSON.parse(ls.get('chans')||'[]')}catch{}
  const old=ls.get('chan');if(!saved.length&&old)saved=[old];
  saved.forEach(c=>open(c,false));
  if(chans.length)select(chans[0]);else status('Añade un canal para empezar');
  connect();
}

function open(name,sel=true){
  name=name.trim().toLowerCase().replace(/^#/,'');
  if(!name)return;
  if(!chans.includes(name)){
    chans.push(name);ls.set('chans',JSON.stringify(chans));
    const p=document.createElement('div');p.className='pane';$('#panes').append(p);panes[name]=p;
    const t=document.createElement('div');t.className='tab';
    const b=document.createElement('button');b.className='sec';b.textContent=name;b.onclick=()=>select(name);
    const x=document.createElement('button');x.className='sec x';x.textContent='✕';x.title='Cerrar #'+name;x.setAttribute('aria-label','Cerrar '+name);x.onclick=()=>close(name);
    t.append(b,x);$('#tabs').append(t);tabs[name]=t;
    if(ws&&ws.readyState===1)ws.send('JOIN #'+name);
  }
  if(sel)select(name);
}
function showVideo(){
  $('#main').classList.toggle('vid',vid&&!!active);
  const v=$('#video');
  if(vid&&active){
    if(v.dataset.ch!==active){
      v.dataset.ch=active;v.innerHTML='';
      const f=document.createElement('iframe');
      f.src='https://player.twitch.tv/?channel='+encodeURIComponent(active)+'&parent='+location.hostname;
      f.allowFullscreen=true;f.title='Stream de '+active;v.append(f);
    }
  }else{v.innerHTML='';v.dataset.ch=''}
  $('#tv').textContent=vid?'Ocultar stream':'Ver stream';
}
$('#tv').onclick=()=>{vid=!vid;ls.set('vid',vid?'1':'0');showVideo()};
function select(n){
  active=n;
  for(const c of chans){panes[c].classList.toggle('on',c===n);tabs[c].classList.toggle('on',c===n)}
  tabs[n].classList.remove('new');panes[n].scrollTop=panes[n].scrollHeight;showVideo();
}
function close(n){
  if(ws&&ws.readyState===1)ws.send('PART #'+n);
  panes[n].remove();tabs[n].remove();delete panes[n];delete tabs[n];
  chans=chans.filter(c=>c!==n);ls.set('chans',JSON.stringify(chans));
  if(active===n){active=null;if(chans.length)select(chans[chans.length-1]);else showVideo()}
}

function connect(){
  if(ws){ws.onclose=null;ws.close()}
  const s=ws=new WebSocket('wss://irc-ws.chat.twitch.tv:443');
  s.onopen=()=>{
    s.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
    s.send('PASS oauth:'+token);s.send('NICK '+me.login);
    chans.forEach(c=>s.send('JOIN #'+c));
    status('Conectado como '+me.login);
  };
  s.onmessage=e=>e.data.split('\r\n').filter(Boolean).forEach(l=>handle(l,s));
  s.onclose=()=>{if(ws===s){status('Desconectado. Reintentando…');setTimeout(()=>ws===s&&connect(),3000)}};
}

function parse(l){
  const tags={};
  if(l[0]==='@'){const i=l.indexOf(' ');l.slice(1,i).split(';').forEach(p=>{const j=p.indexOf('=');tags[p.slice(0,j)]=p.slice(j+1)});l=l.slice(i+1)}
  const m=l.match(/^(?::(\S+) )?(\S+)(?: (.*))?$/)||[];
  return{tags,prefix:m[1]||'',cmd:m[2]||'',rest:m[3]||''};
}

function handle(line,s){
  if(line.startsWith('PING')){s.send('PONG :tmi.twitch.tv');return}
  const{tags,prefix,cmd,rest}=parse(line);
  const c=(rest.match(/^#(\S+)/)||[])[1];
  const text=rest.includes(' :')?rest.slice(rest.indexOf(' :')+2):'';
  if(cmd==='USERSTATE'&&c)ustate[c]=tags;
  else if(cmd==='NOTICE'&&/authentication failed/i.test(rest))logout('No se pudo iniciar sesión. Inténtalo otra vez.');
  else if(cmd==='NOTICE'&&panes[c])sys(c,text);
  else if(cmd==='CLEARMSG'&&panes[c]){const el=panes[c].querySelector('[data-id="'+tags['target-msg-id']+'"]');if(el)el.classList.add('del')}
  else if(cmd==='CLEARCHAT'&&panes[c])sys(c,text?text+' fue expulsado del chat.':'El chat fue limpiado.');
  else if(cmd==='PRIVMSG'&&panes[c]){
    let t=text,act=false;
    if(t.startsWith('\x01ACTION ')){act=true;t=t.slice(8).replace(/\x01$/,'')}
    add(c,tags,prefix.split('!')[0],t,act);
    if(c!==active)tabs[c].classList.add('new');
  }
}

function send(){
  const i=$('#msg'),t=i.value.trim();
  if(!t||!active||!ws||ws.readyState!==1)return;
  const act=/^\/me\s/i.test(t);
  if(t[0]==='/'&&!act){sys(active,'Ese comando todavía no está disponible. Llega en la etapa de moderación.');i.value='';return}
  ws.send('PRIVMSG #'+active+' :'+t);
  add(active,ustate[active]||{},me.login,act?t.slice(4):t,act);
  i.value='';
}

function sys(c,t){const d=document.createElement('div');d.className='sys';d.textContent=t;push(c,d)}
function push(c,el){
  const p=panes[c],near=p.scrollHeight-p.scrollTop-p.clientHeight<80;
  p.append(el);
  while(p.children.length>500)p.firstChild.remove();
  if(near)p.scrollTop=p.scrollHeight;
}
function colorOf(n){let h=0;for(const ch of n)h=(h*31+ch.charCodeAt(0))%360;return'hsl('+h+',70%,68%)'}

function add(c,tags,login,text,act){
  const row=document.createElement('div');
  row.className='m'+(act?' act':'');row.dataset.id=tags.id||'';
  const tm=document.createElement('time');
  tm.textContent=new Date(+tags['tmi-sent-ts']||Date.now()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  row.append(tm);
  (tags.badges||'').split(',').filter(Boolean).forEach(b=>{
    const n=BADGE[b.split('/')[0]];
    if(n){const s=document.createElement('span');s.className='bd';s.textContent=n;row.append(s)}
  });
  const u=document.createElement('span');u.className='u';
  u.textContent=tags['display-name']||login;u.style.color=tags.color||colorOf(login);
  row.append(u,act?' ':': ');
  const em=[];
  (tags.emotes||'').split('/').filter(Boolean).forEach(e=>{
    const[id,pos]=e.split(':');
    pos.split(',').forEach(p=>{const[a,b]=p.split('-');em.push([+a,+b,id])});
  });
  em.sort((x,y)=>x[0]-y[0]);
  const cp=[...text],body=document.createElement('span');body.className='t';
  let i=0;
  em.forEach(([a,b,id])=>{
    if(a>i)body.append(cp.slice(i,a).join(''));
    const im=new Image();im.src='https://static-cdn.jtvnw.net/emoticons/v2/'+id+'/default/dark/1.0';
    im.alt=im.title=cp.slice(a,b+1).join('');im.className='em';body.append(im);i=b+1;
  });
  body.append(cp.slice(i).join(''));
  row.append(body);push(c,row);
}
init();
</script></body></html>
