<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat de Twitch</title>
<style>
:root{--bg:#14161c;--panel:#1b1e27;--line:#2a2e3a;--tx:#e7e9ef;--mut:#8b91a3;--ac:#a98bff}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
input,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:.45rem .7rem}
button{cursor:pointer;background:var(--ac);color:#15121f;border-color:transparent;font-weight:600}
button.sec{background:var(--bg);color:var(--tx);border-color:var(--line);font-weight:400}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.hide{display:none!important}
#setup{max-width:560px;margin:3rem auto;padding:0 1.2rem}
#setup h1{font-size:1.5rem;margin:0 0 .6rem}
#setup ol{padding-left:1.2rem;color:var(--mut)}#setup li{margin:.4rem 0}
#setup code{background:var(--panel);padding:.15rem .4rem;border-radius:4px;color:var(--tx);word-break:break-all}
#setup input{width:100%;margin:.8rem 0}
#err{color:#ff8a8a;min-height:1.3em}
#app{flex:1;display:flex;flex-direction:column;min-height:0}
header{display:flex;gap:.5rem;align-items:center;padding:.6rem .8rem;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header input{width:min(220px,50vw)}
#st{color:var(--mut);font-size:13px;margin-left:auto}
#chat{flex:1;overflow-y:auto;padding:.6rem .9rem}
.m{padding:.12rem 0;word-wrap:break-word;overflow-wrap:anywhere}
.m time{color:var(--mut);font-size:12px;margin-right:.45rem}
.bd{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 .3rem;margin-right:.3rem;color:var(--mut)}
.u{font-weight:700}.em{height:1.5em;vertical-align:middle;margin:0 1px}
.act .t{font-style:italic}.del .t{text-decoration:line-through;opacity:.5}
.sys{color:var(--mut);font-size:13px;padding:.2rem 0}
</style></head><body>

<section id="setup" class="hide">
  <h1>Entra con tu cuenta de Twitch</h1>
  <ol>
    <li>Registra una aplicación en <code>dev.twitch.tv/console</code>.</li>
    <li>En "URL de redireccionamiento OAuth" pega exactamente esta dirección: <code id="redir"></code></li>
    <li>Elige el tipo de cliente "Público" y copia aquí su Client ID.</li>
  </ol>
  <input id="cid" placeholder="Client ID" autocomplete="off">
  <button id="login">Iniciar sesión con Twitch</button>
  <p id="err"></p>
</section>

<div id="app" class="hide">
  <header>
    <input id="chan" placeholder="Canal (ej. feeden_)" autocomplete="off">
    <button id="go">Entrar al chat</button>
    <button id="out" class="sec">Cerrar sesión</button>
    <span id="st"></span>
  </header>
  <main id="chat" aria-live="polite"></main>
</div>

<script>
const $=s=>document.querySelector(s);
const ls={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}},del:k=>{try{localStorage.removeItem(k)}catch{}}};
const BADGE={broadcaster:'Streamer',moderator:'Mod',lead_moderator:'Mod principal',vip:'VIP',subscriber:'Sub',founder:'Fundador',staff:'Staff'};
const redirect=location.origin+location.pathname;
let token=ls.get('tok'),me=null,ws=null,box=$('#chat');

$('#redir').textContent=redirect;
$('#cid').value=ls.get('cid')||'';

$('#login').onclick=()=>{
  const cid=$('#cid').value.trim();
  if(!cid){$('#err').textContent='Escribe tu Client ID.';return}
  ls.set('cid',cid);
  const st=crypto.randomUUID();sessionStorage.setItem('st',st);
  location.href='https://id.twitch.tv/oauth2/authorize?'+new URLSearchParams({client_id:cid,redirect_uri:redirect,response_type:'token',scope:'chat:read',state:st});
};
$('#out').onclick=()=>{ls.del('tok');token=null;if(ws)ws.close();ws=null;show('setup')};
$('#go').onclick=()=>join($('#chan').value);
$('#chan').onkeydown=e=>{if(e.key==='Enter')join(e.target.value)};

function show(w,msg){
  $('#setup').classList.toggle('hide',w!=='setup');
  $('#app').classList.toggle('hide',w!=='app');
  if(msg)$('#err').textContent=msg;
}
function status(t){$('#st').textContent=t}

async function init(){
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get('access_token')){
    if(h.get('state')===sessionStorage.getItem('st')){token=h.get('access_token');ls.set('tok',token)}
    history.replaceState(null,'',location.pathname);
  }
  if(!token)return show('setup');
  try{
    const r=await fetch('https://id.twitch.tv/oauth2/validate',{headers:{Authorization:'OAuth '+token}});
    if(!r.ok)throw 0;
    me=await r.json();
    show('app');status('Sesión: '+me.login);
    const last=ls.get('chan');if(last){$('#chan').value=last;join(last)}
  }catch{ls.del('tok');token=null;show('setup','Tu sesión expiró. Inicia sesión otra vez.')}
}

function join(name){
  name=name.trim().toLowerCase().replace(/^#/,'');
  if(!name||!me)return;
  ls.set('chan',name);box.innerHTML='';
  if(ws){ws.onclose=null;ws.close()}
  const sock=ws=new WebSocket('wss://irc-ws.chat.twitch.tv:443');
  sock.onopen=()=>{
    sock.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
    sock.send('PASS oauth:'+token);sock.send('NICK '+me.login);sock.send('JOIN #'+name);
    status('Conectando a #'+name+'…');
  };
  sock.onmessage=e=>e.data.split('\r\n').filter(Boolean).forEach(l=>handle(l,sock,name));
  sock.onclose=()=>{if(ws===sock){status('Desconectado. Reintentando…');setTimeout(()=>ws===sock&&join(name),3000)}};
}

function parse(l){
  const tags={};
  if(l[0]==='@'){const i=l.indexOf(' ');l.slice(1,i).split(';').forEach(p=>{const j=p.indexOf('=');tags[p.slice(0,j)]=p.slice(j+1)});l=l.slice(i+1)}
  const m=l.match(/^(?::(\S+) )?(\S+)(?: (.*))?$/)||[];
  return{tags,prefix:m[1]||'',cmd:m[2]||'',rest:m[3]||''};
}

function handle(line,sock,name){
  if(line.startsWith('PING')){sock.send('PONG :tmi.twitch.tv');return}
  const{tags,prefix,cmd,rest}=parse(line);
  if(cmd==='ROOMSTATE')status('Conectado a #'+name);
  else if(cmd==='NOTICE'&&/authentication failed/i.test(rest)){ls.del('tok');token=null;show('setup','No se pudo iniciar sesión. Inténtalo otra vez.')}
  else if(cmd==='CLEARMSG'){const el=box.querySelector('[data-id="'+tags['target-msg-id']+'"]');if(el)el.classList.add('del')}
  else if(cmd==='CLEARCHAT'){sys(rest.includes(':')?rest.split(':').pop()+' fue expulsado del chat.':'El chat fue limpiado.')}
  else if(cmd==='PRIVMSG'){
    let text=rest.slice(rest.indexOf(' :')+2),act=false;
    if(text.startsWith('\x01ACTION ')){act=true;text=text.slice(8).replace(/\x01$/,'')}
    add(tags,prefix.split('!')[0],text,act);
  }
}

function sys(t){const d=document.createElement('div');d.className='sys';d.textContent=t;push(d)}
function push(el){
  const near=box.scrollHeight-box.scrollTop-box.clientHeight<80;
  box.append(el);
  while(box.children.length>500)box.firstChild.remove();
  if(near)box.scrollTop=box.scrollHeight;
}
function colorOf(n){let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return'hsl('+h+',70%,68%)'}

function add(tags,login,text,act){
  const row=document.createElement('div');
  row.className='m'+(act?' act':'');row.dataset.id=tags.id||'';
  const tm=document.createElement('time');
  tm.textContent=new Date(+tags['tmi-sent-ts']||Date.now()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  row.append(tm);
  (tags.badges||'').split(',').filter(Boolean).forEach(b=>{
    const n=BADGE[b.split('/')[0]];
    if(n){const s=document.createElement('span');s.className='bd';s.textContent=n;row.append(s)}
  });
  const u=document.createElement('span');u.className='u';
  u.textContent=tags['display-name']||login;u.style.color=tags.color||colorOf(login);
  row.append(u,act?' ':': ');
  const em=[];
  (tags.emotes||'').split('/').filter(Boolean).forEach(e=>{
    const[id,pos]=e.split(':');
    pos.split(',').forEach(p=>{const[a,b]=p.split('-');em.push([+a,+b,id])});
  });
  em.sort((x,y)=>x[0]-y[0]);
  const cp=[...text],body=document.createElement('span');body.className='t';
  let i=0;
  em.forEach(([a,b,id])=>{
    if(a>i)body.append(cp.slice(i,a).join(''));
    const im=new Image();im.src='https://static-cdn.jtvnw.net/emoticons/v2/'+id+'/default/dark/1.0';
    im.alt=im.title=cp.slice(a,b+1).join('');im.className='em';body.append(im);i=b+1;
  });
  body.append(cp.slice(i).join(''));
  row.append(body);push(row);
}
init();
</script></body></html>
